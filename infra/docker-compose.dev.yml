# =============================================================================
# NovaPay — Development Compose
# =============================================================================
# Fast local development without rebuilding production images.
#
# Usage:
#   make dev-up        Build deps (once) + start the dev stack
#   make dev-down      Stop and remove dev containers
#   make dev-logs      Tail dev logs
#   make dev-ps        Show dev containers
#   make dev-build     Rebuild deps only (after package.json changes)
#
# How it works:
#   - An init container installs npm dependencies into named volumes (once).
#   - App containers mount source code via bind mount for live editing.
#   - Named volumes for node_modules and .prisma persist across restarts.
#   - No production Dockerfiles are used; all services run on node:20-alpine.
#   - Monitoring stack (Prometheus, Grafana) is excluded by default for speed.
#     Use --profile monitoring to include Prometheus + Grafana + cAdvisor.
#
# Network isolation:
#   This stack uses project name "novapay-dev" (via `name:` below) so its
#   containers and network never collide with the infra/assessment stack
#   (which uses project name "infra" by default from its directory).
#
#   To run monitoring against dev services:
#     docker compose -f infra/docker-compose.dev.yml --profile monitoring up -d
# =============================================================================

name: novapay-dev

x-node-env: &node-env
  NODE_ENV: development
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novapay
      POSTGRES_PASSWORD: novapay
      POSTGRES_MULTIPLE_DATABASES: "account_db,transaction_db,ledger_db,fx_db,payroll_db,admin_db"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:8080"
    depends_on:
      api-gateway:
        condition: service_started

  # ── Dependency Installer (runs once per package-lock.json change) ──────────

  deps:
    image: node:20-alpine
    environment:
      PRISMA_GENERATE_SKIP_AUTOGENERATION: "true"
    volumes:
      - ../services/api-gateway/package.json:/srv/api-gateway/package.json:ro
      - ../services/api-gateway/package-lock.json:/srv/api-gateway/package-lock.json:ro
      - ../services/account-service/package.json:/srv/account-service/package.json:ro
      - ../services/account-service/package-lock.json:/srv/account-service/package-lock.json:ro
      - ../services/account-service/prisma.config.ts:/srv/account-service/prisma.config.ts:ro
      - ../services/account-service/prisma/schema:/srv/account-service/prisma/schema:ro
      - ../services/transaction-service/package.json:/srv/transaction-service/package.json:ro
      - ../services/transaction-service/package-lock.json:/srv/transaction-service/package-lock.json:ro
      - ../services/transaction-service/prisma.config.ts:/srv/transaction-service/prisma.config.ts:ro
      - ../services/transaction-service/prisma/schema:/srv/transaction-service/prisma/schema:ro
      - ../services/ledger-service/package.json:/srv/ledger-service/package.json:ro
      - ../services/ledger-service/package-lock.json:/srv/ledger-service/package-lock.json:ro
      - ../services/ledger-service/prisma.config.ts:/srv/ledger-service/prisma.config.ts:ro
      - ../services/ledger-service/prisma/schema:/srv/ledger-service/prisma/schema:ro
      - ../services/fx-service/package.json:/srv/fx-service/package.json:ro
      - ../services/fx-service/package-lock.json:/srv/fx-service/package-lock.json:ro
      - ../services/fx-service/prisma.config.ts:/srv/fx-service/prisma.config.ts:ro
      - ../services/fx-service/prisma/schema:/srv/fx-service/prisma/schema:ro
      - ../services/payroll-service/package.json:/srv/payroll-service/package.json:ro
      - ../services/payroll-service/package-lock.json:/srv/payroll-service/package-lock.json:ro
      - ../services/payroll-service/prisma.config.ts:/srv/payroll-service/prisma.config.ts:ro
      - ../services/payroll-service/prisma/schema:/srv/payroll-service/prisma/schema:ro
      - ../services/admin-service/package.json:/srv/admin-service/package.json:ro
      - ../services/admin-service/package-lock.json:/srv/admin-service/package-lock.json:ro
      - ../services/admin-service/prisma.config.ts:/srv/admin-service/prisma.config.ts:ro
      - ../services/admin-service/prisma/schema:/srv/admin-service/prisma/schema:ro
      # Named volumes — init writes deps here; app containers read from here
      - gw-node-modules:/deps/gw/node_modules
      - acct-node-modules:/deps/acct/node_modules
      - txn-node-modules:/deps/txn/node_modules
      - ledger-node-modules:/deps/ledger/node_modules
      - fx-node-modules:/deps/fx/node_modules
      - payroll-node-modules:/deps/payroll/node_modules
      - admin-node-modules:/deps/admin/node_modules
    command:
      - /bin/sh
      - -c
      - |
        set -e
        LOCK_HASH=$$(md5sum /srv/*/package-lock.json 2>/dev/null | sort | md5sum | cut -d' ' -f1)
        MARKER="/tmp/.deps-installed"

        if [ -f "$$MARKER" ] && [ "$$(cat $$MARKER)" = "$$LOCK_HASH" ]; then
          echo "==> Dependencies up to date — skipping npm ci"
          exit 0
        fi

        echo "==> Installing dependencies..."

        install_deps() {
          local svc="$$1"
          local vol="$$2"
          echo "  npm ci: $$svc"
          cd "/srv/$$svc" && npm ci
          mkdir -p "/deps/$$vol/node_modules"
          cp -a /srv/$$svc/node_modules/. "/deps/$$vol/node_modules/"
          if [ -f "/srv/$$svc/prisma.config.ts" ]; then
            echo "  prisma generate: $$svc"
            cd "/srv/$$svc" && npx prisma generate
          fi
        }

        install_deps api-gateway gw
        install_deps account-service acct
        install_deps transaction-service txn
        install_deps ledger-service ledger
        install_deps fx-service fx
        install_deps payroll-service payroll
        install_deps admin-service admin

        echo "$$LOCK_HASH" > "$$MARKER"
        echo "==> Dependencies installed"

  # ── Application Services ──────────────────────────────────────────────────

  api-gateway:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "npm run start"]
    environment:
      <<: *node-env
      OTEL_SERVICE_NAME: api-gateway
      PORT: 3000
      ACCOUNT_SERVICE_URL: http://account-service:3001
      TRANSACTION_SERVICE_URL: http://transaction-service:3002
      LEDGER_SERVICE_URL: http://ledger-service:3003
      FX_SERVICE_URL: http://fx-service:3004
      PAYROLL_SERVICE_URL: http://payroll-service:3005
      SERVICE_TOKEN: novapay-dev-gateway-token
      ADMIN_SERVICE_URL: http://admin-service:3006
    volumes:
      - ../services/api-gateway/package.json:/app/package.json:ro
      - ../services/api-gateway/src:/app/src:ro
      - gw-node-modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      ledger-service:
        condition: service_started
      fx-service:
        condition: service_started
      payroll-service:
        condition: service_started
      admin-service:
        condition: service_started

  account-service:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]
    environment:
      <<: *node-env
      OTEL_SERVICE_NAME: account-service
      PORT: 3001
      DATABASE_URL: postgres://novapay:novapay@postgres:5432/account_db
      SERVICE_TOKEN: novapay-dev-account-token
      PEER_TRANSACTION_SERVICE_TOKEN: novapay-dev-transaction-token
      PEER_API_GATEWAY_TOKEN: novapay-dev-gateway-token
      FIELD_ENCRYPTION_KEK: novapay-local-dev-encryption-kek-2024
    volumes:
      - ../services/account-service/package.json:/app/package.json:ro
      - ../services/account-service/prisma.config.ts:/app/prisma.config.ts:ro
      - ../services/account-service/src:/app/src:ro
      - ../services/account-service/prisma:/app/prisma:ro
      - acct-node-modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  transaction-service:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]
    environment:
      <<: *node-env
      OTEL_SERVICE_NAME: transaction-service
      PORT: 3002
      DATABASE_URL: postgres://novapay:novapay@postgres:5432/transaction_db
      REDIS_URL: redis://redis:6379
      SERVICE_TOKEN: novapay-dev-transaction-token
      PEER_API_GATEWAY_TOKEN: novapay-dev-gateway-token
      PEER_PAYROLL_SERVICE_TOKEN: novapay-dev-payroll-token
      ACCOUNT_SERVICE_URL: http://account-service:3001
      LEDGER_SERVICE_URL: http://ledger-service:3003
      FX_SERVICE_URL: http://fx-service:3004
    volumes:
      - ../services/transaction-service/package.json:/app/package.json:ro
      - ../services/transaction-service/prisma.config.ts:/app/prisma.config.ts:ro
      - ../services/transaction-service/src:/app/src:ro
      - ../services/transaction-service/prisma:/app/prisma:ro
      - txn-node-modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  ledger-service:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]
    environment:
      <<: *node-env
      OTEL_SERVICE_NAME: ledger-service
      PORT: 3003
      DATABASE_URL: postgres://novapay:novapay@postgres:5432/ledger_db
      SERVICE_TOKEN: novapay-dev-ledger-token
      PEER_TRANSACTION_SERVICE_TOKEN: novapay-dev-transaction-token
      PEER_ADMIN_SERVICE_TOKEN: novapay-dev-admin-token
      PEER_API_GATEWAY_TOKEN: novapay-dev-gateway-token
    volumes:
      - ../services/ledger-service/package.json:/app/package.json:ro
      - ../services/ledger-service/prisma.config.ts:/app/prisma.config.ts:ro
      - ../services/ledger-service/src:/app/src:ro
      - ../services/ledger-service/prisma:/app/prisma:ro
      - ledger-node-modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  fx-service:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]
    environment:
      <<: *node-env
      OTEL_SERVICE_NAME: fx-service
      PORT: 3004
      DATABASE_URL: postgres://novapay:novapay@postgres:5432/fx_db
      FX_PROVIDER_DOWN: "false"
      SERVICE_TOKEN: novapay-dev-fx-token
      PEER_TRANSACTION_SERVICE_TOKEN: novapay-dev-transaction-token
      PEER_API_GATEWAY_TOKEN: novapay-dev-gateway-token
    volumes:
      - ../services/fx-service/package.json:/app/package.json:ro
      - ../services/fx-service/prisma.config.ts:/app/prisma.config.ts:ro
      - ../services/fx-service/src:/app/src:ro
      - ../services/fx-service/prisma:/app/prisma:ro
      - fx-node-modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  payroll-service:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]
    environment:
      <<: *node-env
      OTEL_SERVICE_NAME: payroll-service
      PORT: 3005
      DATABASE_URL: postgres://novapay:novapay@postgres:5432/payroll_db
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: payroll
      TRANSACTION_SERVICE_URL: http://transaction-service:3002
      SERVICE_TOKEN: novapay-dev-payroll-token
      PEER_API_GATEWAY_TOKEN: novapay-dev-gateway-token
    volumes:
      - ../services/payroll-service/package.json:/app/package.json:ro
      - ../services/payroll-service/prisma.config.ts:/app/prisma.config.ts:ro
      - ../services/payroll-service/src:/app/src:ro
      - ../services/payroll-service/prisma:/app/prisma:ro
      - payroll-node-modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  admin-service:
    image: node:20-alpine
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]
    environment:
      <<: *node-env
      OTEL_SERVICE_NAME: admin-service
      PORT: 3006
      DATABASE_URL: postgres://novapay:novapay@postgres:5432/admin_db
      LEDGER_SERVICE_URL: http://ledger-service:3003
      SERVICE_TOKEN: novapay-dev-admin-token
      PEER_API_GATEWAY_TOKEN: novapay-dev-gateway-token
    volumes:
      - ../services/admin-service/package.json:/app/package.json:ro
      - ../services/admin-service/prisma.config.ts:/app/prisma.config.ts:ro
      - ../services/admin-service/src:/app/src:ro
      - ../services/admin-service/prisma:/app/prisma:ro
      - admin-node-modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ── Observability (lightweight) ────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports:
      - "16687:16686"
      - "4319:4317"
      - "4320:4318"

  # ── Full Observability (opt-in via --profile monitoring) ───────────────────
  # Start with: docker compose -f infra/docker-compose.dev.yml --profile monitoring up -d

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    ports:
      - "9091:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.1.0
    ports:
      - "3008:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/novapay.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    # Internal only: reachable as http://loki:3100 inside the network.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.5.1
    command: run --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      ALLOY_PROJECT: novapay-dev
    depends_on:
      loki:
        condition: service_healthy

volumes:
  pgdata:
  gw-node-modules:
  acct-node-modules:
  txn-node-modules:
  ledger-node-modules:
  fx-node-modules:
  payroll-node-modules:
  admin-node-modules:
  loki-data:
