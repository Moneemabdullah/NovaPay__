server {
    listen 8080;
    # 64k rejected legitimate large payroll batches (items[] JSON) with
    # HTTP 413 before they reached the application. 10m admits large
    # batches while still bounding abuse; per-item and per-batch business
    # validation happens in the services (e.g. payroll MAX_PAYROLL_ITEMS).
    client_max_body_size 10m;

    location = /health {
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }

    location / {
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
