apiVersion: 1
groups:
  - orgId: 1
    name: NovaPay Invariants
    folder: NovaPay
    interval: 1m
    rules:
      - uid: novapay-ledger-invariant-violations
        title: Ledger invariant violations detected
        condition: B
        for: 1m
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: instant
            model:
              refId: A
              expr: sum(ledger_invariant_violations_total) > 0
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: B
            datasourceUid: __expr__
            type: threshold
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
            relativeTimeRange:
              from: 600
              to: 0
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Ledger invariant check found a non-zero per-currency delta