name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            account-service:
              - 'services/account-service/**'
            transaction-service:
              - 'services/transaction-service/**'
            ledger-service:
              - 'services/ledger-service/**'
            fx-service:
              - 'services/fx-service/**'
            payroll-service:
              - 'services/payroll-service/**'
            admin-service:
              - 'services/admin-service/**'

      - name: Build matrix from filter outputs
        id: matrix
        run: |
          services='[]'
          if [ "${{ steps.filter.outputs.api-gateway }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('api-gateway'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.account-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('account-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.transaction-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('transaction-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.ledger-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('ledger-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.fx-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('fx-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.payroll-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('payroll-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.admin-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('admin-service'); print(json.dumps(m))")
          fi

          if [ "$services" = "[]" ]; then
            echo "matrix={\"service\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"service\":${services}}" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  test-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix).service }}
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: npm test
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          FIELD_ENCRYPTION_KEK: "test-kek-ci-0123456789abcdef0123"
          ACCOUNT_SERVICE_URL: "http://localhost:19999"
          LEDGER_SERVICE_URL: "http://localhost:19999"
          FX_SERVICE_URL: "http://localhost:19999"
          REDIS_URL: "redis://localhost:6379"
          QUEUE_NAME: "test-queue"
          TRANSACTION_SERVICE_URL: "http://localhost:19999"

      - name: Create test database for integration tests
        run: psql -h localhost -U test -d test -c "CREATE DATABASE \"${{ matrix.service }}_test\";" || true
        env:
          PGPASSWORD: test

      - name: Run Prisma migrations for integration tests
        working-directory: services/${{ matrix.service }}
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/${{ matrix.service }}_test"

      - name: Run integration tests
        if: hashFiles(format('services/{0}/vitest.integration.config.ts', matrix.service)) != ''
        working-directory: services/${{ matrix.service }}
        run: npm run test:integration
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/${{ matrix.service }}_test"
          FIELD_ENCRYPTION_KEK: "test-kek-ci-0123456789abcdef0123"
          ACCOUNT_SERVICE_URL: "http://localhost:19999"
          LEDGER_SERVICE_URL: "http://localhost:19999"
          FX_SERVICE_URL: "http://localhost:19999"
          REDIS_URL: "redis://localhost:6379"
          QUEUE_NAME: "test-queue"
          TRANSACTION_SERVICE_URL: "http://localhost:19999"

      - name: TypeScript typecheck
        working-directory: services/${{ matrix.service }}
        run: npm run build

      - name: Validate version bump
        working-directory: services/${{ matrix.service }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
          else
            BASE_SHA=${{ github.event.before }}
          fi

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial commit — version check skipped"
            exit 0
          fi

          BASE_VERSION=$(git show "$BASE_SHA:services/${{ matrix.service }}/package.json" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          echo "Base version:    $BASE_VERSION"

          if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Version must be bumped when modifying ${{ matrix.service }}. Current: $CURRENT_VERSION, Base: $BASE_VERSION"
            exit 1
          fi

          echo "Version bumped: $BASE_VERSION → $CURRENT_VERSION"

      - name: Read service version
        id: version
        working-directory: services/${{ matrix.service }}
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: services/${{ matrix.service }}
        run: docker build --build-arg DATABASE_URL="postgresql://test:test@localhost:5432/test" -t ${{ matrix.service }}:${{ steps.version.outputs.version }} .

      - name: Verify Docker image
        run: docker images ${{ matrix.service }}:${{ steps.version.outputs.version }}

  ci-status:
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, test-build]
    steps:
      - name: Check results
        run: |
          echo "detect-changes result: ${{ needs.detect-changes.result }}"
          echo "test-build result:     ${{ needs.test-build.result }}"

          if [ "${{ needs.detect-changes.result }}" = "failure" ]; then
            echo "::error::Change detection failed"
            exit 1
          fi

          if [ "${{ needs.test-build.result }}" = "failure" ]; then
            echo "::error::One or more service jobs failed"
            exit 1
          fi

          if [ "${{ needs.test-build.result }}" = "cancelled" ]; then
            echo "::error::Service jobs were cancelled"
            exit 1
          fi

          echo "All checks passed"
