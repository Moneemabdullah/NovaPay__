name: CI

# Top-level orchestrator. Stage logic lives in reusable workflows:
#   ci-quality.yml (typecheck + lint)
#   ci-tests.yml   (unit + integration + coverage + report-only audit)
#   ci-build.yml   (Docker build verification + version gate)
#
# Flow:
#   detect-changes --> quality --\
#                \-> tests    ---\--> build --> ci-status
#
# `ci-status` is the single required branch-protection check (stable name).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            account-service:
              - 'services/account-service/**'
            transaction-service:
              - 'services/transaction-service/**'
            ledger-service:
              - 'services/ledger-service/**'
            fx-service:
              - 'services/fx-service/**'
            payroll-service:
              - 'services/payroll-service/**'
            admin-service:
              - 'services/admin-service/**'

      - name: Build matrix from filter outputs
        id: matrix
        run: |
          services='[]'
          if [ "${{ steps.filter.outputs.api-gateway }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('api-gateway'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.account-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('account-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.transaction-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('transaction-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.ledger-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('ledger-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.fx-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('fx-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.payroll-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('payroll-service'); print(json.dumps(m))")
          fi
          if [ "${{ steps.filter.outputs.admin-service }}" = "true" ]; then
            services=$(echo "$services" | python3 -c "import sys,json; m=json.load(sys.stdin); m.append('admin-service'); print(json.dumps(m))")
          fi

          if [ "$services" = "[]" ]; then
            echo "matrix={\"service\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"service\":${services}}" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/ci-quality.yml
    with:
      services: ${{ needs.detect-changes.outputs.matrix }}

  tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/ci-tests.yml
    with:
      services: ${{ needs.detect-changes.outputs.matrix }}

  build:
    needs: [detect-changes, quality, tests]
    if: needs.detect-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/ci-build.yml
    with:
      services: ${{ needs.detect-changes.outputs.matrix }}

  ci-status:
    runs-on: ubuntu-latest
    if: always()
    needs: [detect-changes, quality, tests, build]
    steps:
      - name: Check results
        run: |
          echo "detect-changes result: ${{ needs.detect-changes.result }}"
          echo "quality result:        ${{ needs.quality.result }}"
          echo "tests result:          ${{ needs.tests.result }}"
          echo "build result:          ${{ needs.build.result }}"

          if [ "${{ needs.detect-changes.result }}" = "failure" ]; then
            echo "::error::Change detection failed"
            exit 1
          fi

          if [ "${{ needs.quality.result }}" = "failure" ] || [ "${{ needs.quality.result }}" = "cancelled" ]; then
            echo "::error::quality job ${{ needs.quality.result }}"
            exit 1
          fi

          if [ "${{ needs.tests.result }}" = "failure" ] || [ "${{ needs.tests.result }}" = "cancelled" ]; then
            echo "::error::tests job ${{ needs.tests.result }}"
            exit 1
          fi

          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "::error::build job ${{ needs.build.result }}"
            exit 1
          fi

          echo "All checks passed"
